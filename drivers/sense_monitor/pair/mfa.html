<div class="homey-form-group">
  <label class="homey-form-label" for="otp">MFA Verification Code</label>
  <input class="homey-form-input" id="otp" type="text" value="" placeholder="Enter 6-digit code" />
</div>

<button class="homey-button-primary-full" id="otpButton">Verify Code</button>

<script>
  Homey.setTitle('Enter MFA Code');

  document.getElementById('otpButton').addEventListener('click', async () => {
    const otp = document.getElementById('otp').value;

    if (!otp) {
      Homey.alert('Please enter the MFA verification code.');
      return;
    }

    Homey.showLoadingOverlay();

    try {
      await Homey.emit('mfa', { otp });
      Homey.hideLoadingOverlay();
      Homey.nextView();
    } catch (err) {
      Homey.hideLoadingOverlay();
      Homey.alert(err.message || 'Failed to verify MFA code');
    }
  });
</script>
