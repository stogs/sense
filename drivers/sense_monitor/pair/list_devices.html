<div class="homey-form-group">
  <p class="homey-p" id="statusMessage">Connecting to Sense and discovering monitors...</p>
</div>

<script>
  Homey.setTitle('Discovering Sense Monitors');
  Homey.showLoadingOverlay();

  Homey.emit('list_devices', null, function(err, devices) {
    Homey.hideLoadingOverlay();
    if (err) {
      Homey.alert(err.message || 'Failed to discover devices');
      return;
    }
    if (!devices || devices.length === 0) {
      Homey.alert('No Sense monitors found on this account.');
      return;
    }
    // In SDK v3, returning devices from session handler automatically populates list view,
    // or we can pass them directly to Homey.addDevice() if using a custom list view.
    // Let's use Homey.addDevice(devices) or let Homey handle it.
    Homey.addDevice(devices, function(err) {
      if (err) {
        Homey.alert(err.message || 'Failed to add device');
        return;
      }
      Homey.done();
    });
  });
</script>
