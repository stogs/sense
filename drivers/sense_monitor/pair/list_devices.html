<div class="homey-form-group">
  <label class="homey-label">Discovering Sense Devices & Appliances...</label>
  <p class="homey-p">Please wait while we fetch your Sense monitor and discovered devices / smart plugs.</p>
</div>

<script>
  Homey.setTitle('Select Sense Devices');
  Homey.showLoadingOverlay();

  Homey.emit('list_devices', function(err, devices) {
    Homey.hideLoadingOverlay();
    if (err) {
      Homey.alert(err.message || 'Failed to discover devices');
      return;
    }
    if (!devices || devices.length === 0) {
      Homey.alert('No Sense monitors or devices found.');
      return;
    }

    Homey.showSelectView(devices, function(err, selectedDevices) {
      if (err) {
        Homey.alert(err.message || 'Failed to select devices');
        return;
      }
      if (!selectedDevices || selectedDevices.length === 0) {
        Homey.alert('No devices selected.');
        return;
      }

      Homey.showLoadingOverlay();
      Homey.addDevices(selectedDevices, function(err) {
        Homey.hideLoadingOverlay();
        if (err) {
          Homey.alert(err.message || 'Failed to add devices');
          return;
        }
        Homey.done();
      });
    });
  });
</script>
