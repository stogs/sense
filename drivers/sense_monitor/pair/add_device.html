<div class="homey-form-group">
  <p class="homey-p">Adding Sense Monitor...</p>
</div>

<script>
  Homey.setTitle('Adding Sense Monitor');
  Homey.showLoadingOverlay();

  Homey.emit('list_devices', function(err, devices) {
    if (err) {
      Homey.hideLoadingOverlay();
      Homey.alert(err.message || 'Failed to discover devices');
      return;
    }
    if (!devices || devices.length === 0) {
      Homey.hideLoadingOverlay();
      Homey.alert('No Sense monitors found.');
      return;
    }

    Homey.addDevice(devices[0], function(err) {
      Homey.hideLoadingOverlay();
      if (err) {
        Homey.alert(err.message || 'Failed to add device');
        return;
      }
      Homey.done();
    });
  });
</script>
