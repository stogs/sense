<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="electricGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background with rounded corners for Homey icon shape -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Distinct Sense Energy Text / Branding Badge at the bottom -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="4">SENSE</text>

  <!-- Electric Energy Pulse Waves behind lightning -->
  <path d="M160 200 C180 150, 332 150, 352 200" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  <path d="M130 170 C160 110, 352 110, 382 170" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" opacity="0.4" />

  <!-- Lightning Bolt -->
  <path d="M276 50L108 266h136l-24 148 184-216H256z" 
        fill="url(#electricGrad)" 
        filter="url(#glow)" />

  <!-- Glossy Highlight -->
  <path d="M268 70L132 250h116l-20 128 156-184H248z" 
        fill="#ffffff" 
        opacity="0.3" />
</svg>
