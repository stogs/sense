<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#c72e25"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Solid vibrant red rounded square background for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#appBg)"/>

  <!-- Centered White House Icon -->
  <path d="M 256 120 L 110 240 V 392 H 210 V 292 H 302 V 392 H 402 V 240 Z" fill="#ffffff" filter="url(#shadow)"/>
</svg>
